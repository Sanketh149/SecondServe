[project]
name = "secondserve-backend"
version = "0.1.0"
description = "SecondServe FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "firebase-admin>=6.7,<7.0",
  "google-cloud-firestore>=2.20,<3.0",
  "google-cloud-storage>=2.8,<3.0",
  "google-cloud-tasks>=2.20,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "pytest>=8.3,<9.0",
  "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
