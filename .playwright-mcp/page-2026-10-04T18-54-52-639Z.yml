          - generic [ref=e81]:
            - paragraph [ref=e82]: Asia-Pacific is home to more than 15 million developers and has one of the fastest-growing developer populations in the world.
            - paragraph [ref=e83]: "The Google Cloud AI Builder Cup, powered by Hack2skill is an open invitation to all of them: start with a problem you understand, build a solution on Google Cloud, and show that something built for a local need can scale to a global one."
            - paragraph [ref=e84]: The premise is simple. You get a real-world problem, you get to form your team and a few weeks to build something that solves it and finally submit it for evaluation.
            - paragraph [ref=e85]: The most potential solutions move on to an in-person finale, where teams from across the JAPAC region come together to demo what they made, in front of a live panel of Google Cloud & industry experts. The Demo Day will be happening in Singapore, with sponsored to & fro travel.
